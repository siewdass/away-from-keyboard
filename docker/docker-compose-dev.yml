networks:
  tibia:
    driver: bridge

services:
  ubuntu:
    container_name: ubuntu
    image: ubuntu:22.04
    platform: linux/amd64
    # Vital para evitar el crash de Qt en M4
    shm_size: 2gb
    networks:
      - tibia
    command:
      - /bin/sh
      - -c
      - |
        apt-get update && apt-get install -y \
          wget tar zsh xvfb libopengl0 libglx0 libgl1-mesa-glx \
          libqt5gui5 libx11-6 libxcb-icccm4 libxcb-image0 \
          libxcb-keysyms1 libxcb-render-util0 libxcb-util1 \
          libxcb-cursor0 libxcb-xinerama0 libxcb-xinput0 \
          libxcb-shape0 libxkbcommon-x11-0 libfontconfig1 \
          libdbus-1-3 locales

        locale-gen en_US.UTF-8
        export LANG=en_US.UTF-8
        export LC_ALL=en_US.UTF-8

        if [ ! -f tibia.x64.tar.gz ]; then
          wget https://static.tibia.com/download/tibia.x64.tar.gz
        fi
        if [ ! -d Tibia ]; then
          tar -xzvf tibia.x64.tar.gz
        fi

        Xvfb :1 -screen 0 1024x768x24 +extension GLX +render -noreset &
        sleep 5

        for i in 1 2; do 
          DISPLAY=:1 ./Tibia/Tibia
        done
